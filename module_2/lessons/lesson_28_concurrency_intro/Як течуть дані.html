<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Як течуть дані</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..700&family=Nunito:wght@400..800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout idea: one "machine room" stage per screen — explanation on the left, a live model on the right; the punched tape is the recurring motif. */
:root {
  --paper: #F3F0E7;
  --card: #FBF9F3;
  --ink: #15213B;
  --muted: #4D5872;
  --line: #D8D1BF;
  --tape: #EFE3A8;
  --tape-edge: #CDBB6E;
  --signal: #2F6FB5;
  --signal-soft: #DCE7F5;
  --hot: #C9581C;
  --hot-ink: #A4440F;
  --hot-soft: #FBE6D6;
  --ok: #2E7D4F;
  --ok-soft: #DDEFE3;
  --bad: #B3261E;
  --bad-soft: #F8DEDC;
  --display: 'Rubik', Arial, sans-serif;
  --body: 'Nunito', Verdana, sans-serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header.top { display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 600; font-size: 18px; }
.sect { font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--hot-ink); }
.counter { margin-left: auto; font-family: var(--mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

main { overflow: auto; }
.stage { max-width: 1240px; margin: 0 auto; padding: 40px 28px 48px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: start; }
.stage.wide { grid-template-columns: 1fr; }
.text { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--hot-ink); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(44px, 6vw, 76px); line-height: 1.02; font-weight: 600; }
h2 { font-size: clamp(30px, 3.4vw, 42px); line-height: 1.12; font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; line-height: 1.25; }
p { margin: 0; max-width: 62ch; }
.lead { font-size: 20px; color: var(--muted); }
.note { font-size: 15px; color: var(--muted); }
.key { font-weight: 800; }
.tip { border-left: 4px solid var(--hot); background: var(--hot-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 16px; }

.widget { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 0 rgba(21,33,59,.04), 0 12px 30px -18px rgba(21,33,59,.25); min-width: 0; }
.wlabel { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--signal); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: #F8F6EF; padding: 9px 16px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; transition: transform .12s, background .12s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.sel { background: var(--signal); border-color: var(--signal); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.mono { font-family: var(--mono); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; font-size: 14px; font-weight: 800; }
.pill.run { background: var(--ok-soft); color: var(--ok); }
.pill.sleep { background: var(--signal-soft); color: var(--signal); }
.pill.wait { background: #ECE8DC; color: var(--muted); }
.pill.hot { background: var(--hot-soft); color: var(--hot-ink); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.log { font-family: var(--mono); font-size: 14px; background: var(--ink); color: #E9EDF5; border-radius: 12px; padding: 12px 14px; min-height: 120px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.log .dim { color: #9AA6BF; }
.log .ok { color: #8FD3A7; }
.log .warn { color: #F4B183; }

/* footer nav */
footer.nav { display: flex; align-items: center; gap: 14px; padding: 12px 28px; border-top: 1px solid var(--line); background: var(--card); }
.dots { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tape-edge); background: var(--tape); cursor: pointer; padding: 0; }
.dot.on { background: var(--ink); border-color: var(--ink); }
.dot.sec { margin-left: 10px; }
.hint { font-size: 13px; color: var(--muted); }

/* punched tape */
.tape-wrap { overflow-x: auto; padding-bottom: 6px; display: flex; flex-direction: column; align-items: flex-start; }
.tape { display: inline-flex; gap: 0; background: var(--tape); border-top: 2px solid var(--tape-edge); border-bottom: 2px solid var(--tape-edge); padding: 10px 8px; }
.tcol { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0 5px; position: relative; }
.tcol.first { border-left: 1px dashed rgba(164,68,15,.35); }
.h { width: 18px; height: 18px; border-radius: 50%; }
.h.on { background: var(--ink); }
.h.off { background: transparent; box-shadow: inset 0 0 0 1px rgba(21,33,59,.10); }
.h.sp { width: 8px; height: 8px; background: rgba(21,33,59,.75); margin: 2px 0; }
.tcol.new .h.on { animation: punch .35s ease-out both; }
.tcol { cursor: pointer; }
.tcol.pick { background: rgba(47,111,181,.22); border-radius: 4px; outline: none; }
.tcol.cur { background: rgba(201,88,28,.18); border-radius: 4px; }
@keyframes punch { from { transform: scale(0); } }
.tlabels { display: inline-flex; padding: 4px 8px 0; }
.tlab { width: 28px; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.tlab.ch { color: var(--ink); font-weight: 700; font-size: 16px; }
.bytes-table { display: flex; flex-wrap: wrap; gap: 8px; }
.bchip { font-family: var(--mono); font-size: 14px; background: var(--signal-soft); border-radius: 8px; padding: 4px 10px; }
.bchip b { font-size: 16px; }
.field { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.field input { font: inherit; font-size: 22px; font-family: var(--mono); padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); width: 260px; }

/* journey */
.chain { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
.node { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; transition: border-color .25s, background .25s, transform .25s; min-height: 150px; }
.node .ic { font-size: 30px; line-height: 1; }
.node .nt { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.2; }
.node .nd { font-size: 13px; color: var(--muted); line-height: 1.3; }
.node.on { border-color: var(--hot); background: var(--hot-soft); transform: translateY(-4px); }
.node .byte { font-family: var(--mono); font-size: 12px; background: var(--ink); color: #fff; border-radius: 6px; padding: 2px 6px; visibility: hidden; }
.node.on .byte { visibility: visible; animation: pop .3s ease-out; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.caption { background: var(--paper); border-radius: 12px; padding: 14px 16px; font-size: 17px; min-height: 84px; }
.caption b { color: var(--hot-ink); }

/* glossary */
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.gcard { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: border-color .2s, background .2s; }
.gcard:hover { border-color: var(--signal); }
.gcard .gt { font-family: var(--display); font-weight: 600; font-size: 20px; }
.gcard .ga { font-size: 15px; color: var(--hot-ink); font-weight: 700; }
.gcard .gr { font-size: 15px; color: var(--muted); }
.gcard.open { background: var(--signal-soft); border-color: var(--signal); }
.gcard .gmore { display: none; font-size: 15px; color: var(--ink); border-top: 1px solid rgba(47,111,181,.3); padding-top: 8px; margin-top: 4px; }
.gcard.open .gmore { display: block; }

/* cores */
.lanes { display: flex; flex-direction: column; gap: 8px; }
.lane { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: center; }
.lane .ln { font-size: 14px; font-weight: 800; color: var(--muted); }
.track { height: 34px; background: #ECE8DC; border-radius: 8px; display: flex; gap: 3px; padding: 3px; overflow: hidden; }
.task { height: 100%; border-radius: 5px; background: var(--signal-soft); position: relative; overflow: hidden; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: var(--signal); }
.task .fill { position: absolute; inset: 0; background: var(--signal); transform-origin: left; transform: scaleX(0); }
.task span { position: relative; }
.task.done span { color: #fff; }
.big { font-family: var(--display); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .sl { font-size: 13px; color: var(--muted); font-weight: 700; }

/* timescale */
.trow { display: grid; grid-template-columns: minmax(0, 1.4fr) 90px minmax(0, 1.6fr); gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; background: none; text-align: left; width: 100%; }
.trow:hover { background: var(--paper); }
.trow.sel { border-color: var(--signal); background: var(--signal-soft); }
.trow .tn { font-weight: 700; }
.trow .tr { font-family: var(--mono); font-size: 14px; color: var(--muted); text-align: right; }
.tbar { height: 22px; background: #ECE8DC; border-radius: 6px; position: relative; overflow: hidden; }
.tbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hot); border-radius: 6px; transition: width .6s cubic-bezier(.2,.7,.2,1); }
.tbar em { position: absolute; left: 8px; top: 0; bottom: 0; display: flex; align-items: center; font-style: normal; font-size: 13px; font-weight: 800; color: var(--ink); }

/* race */
.tills { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.till { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.till .tt { font-weight: 800; font-size: 14px; }
.till .tv { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.till.lock { border-color: var(--hot); background: var(--hot-soft); }
.balance { display: flex; align-items: center; gap: 16px; background: var(--ink); color: #F8F6EF; border-radius: 14px; padding: 14px 18px; flex-wrap: wrap; }
.balance .big { color: #F8F6EF; }

/* run program */
.code { font-family: var(--mono); font-size: 15px; background: var(--ink); color: #E9EDF5; border-radius: 12px; padding: 12px 0; overflow-x: auto; }
.code div { padding: 3px 16px; white-space: pre; border-left: 4px solid transparent; }
.code .cur { background: rgba(242,154,74,.18); border-left-color: #F29A4A; }
.code .ln { color: #7A86A1; margin-right: 12px; }
.mini { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.mbox { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px; font-size: 14px; font-weight: 800; text-align: center; transition: all .25s; }
.mbox.on { border-color: var(--hot); background: var(--hot-soft); }
.mem { display: flex; gap: 8px; flex-wrap: wrap; min-height: 36px; }
.var { font-family: var(--mono); font-size: 14px; background: var(--signal-soft); border-radius: 8px; padding: 5px 10px; animation: pop .3s ease-out; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: #E3DDCC; }
.steps i.on { background: var(--hot); }

/* socket */
.net { position: relative; display: grid; grid-template-columns: 140px 1fr; gap: 28px; align-items: center; min-height: 290px; }
.cloud { background: var(--signal-soft); border-radius: 50%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 15px; color: var(--signal); }
.host { border: 2px dashed var(--ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.host .hip { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.app-box { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; transition: all .25s; }
.app-box .port { font-family: var(--mono); font-weight: 700; background: var(--paper); border-radius: 6px; padding: 2px 8px; }
.app-box.hit { border-color: var(--ok); background: var(--ok-soft); }
.envelope { position: absolute; left: 0; top: 0; background: var(--hot); color: #fff; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 8px; pointer-events: none; opacity: 0; box-shadow: 0 6px 14px -6px rgba(0,0,0,.4); }

/* recv */
.recv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 140px; }
.box .bt { font-weight: 800; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.mailbox { display: flex; gap: 4px; flex-wrap: wrap; min-height: 34px; }
.bytec { font-family: var(--mono); font-size: 14px; font-weight: 700; background: var(--tape); border: 1px solid var(--tape-edge); border-radius: 5px; padding: 3px 6px; animation: pop .25s ease-out; }
.core { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.core-ic { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; transition: background .3s; }
.core-ic.busy { background: var(--hot); color: #fff; }
.core-ic.free { background: var(--ok-soft); color: var(--ok); }

/* tcp */
.pipe { background: var(--signal-soft); border-radius: 999px; padding: 10px 16px; display: flex; gap: 2px; flex-wrap: wrap; min-height: 50px; align-items: center; }
.recvd { display: flex; flex-direction: column; gap: 6px; }
.chunk { font-family: var(--mono); font-size: 16px; display: flex; gap: 10px; align-items: center; animation: pop .25s ease-out; }
.chunk b { background: var(--hot-soft); border-radius: 6px; padding: 2px 8px; }

/* gantt */
.gantt { display: flex; flex-direction: column; gap: 14px; }
.ggroup { display: flex; flex-direction: column; gap: 4px; }
.gh { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; }
.gh .gt { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--hot-ink); }
.grow { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; }
.grow .gn { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gtrack { height: 14px; background: #ECE8DC; border-radius: 4px; position: relative; overflow: hidden; }
.gtrack i { position: absolute; top: 0; bottom: 0; background: var(--signal); border-radius: 4px; }
.axis { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.axis div:last-child { display: flex; justify-content: space-between; }

/* gil */
.glanes { display: flex; flex-direction: column; gap: 8px; }
.glane { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; }
.glane .gl { font-size: 14px; font-weight: 800; }
.cells { display: flex; gap: 2px; height: 30px; }
.cell { flex: 1 0 0; border-radius: 3px; background: #ECE8DC; min-width: 4px; }
.cell.run { background: var(--hot); }
.cell.io { background: repeating-linear-gradient(135deg, var(--signal) 0 4px, var(--signal-soft) 4px 8px); }
.cell.wait { background: #CFC8B5; }
.cell.done { background: transparent; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 18px; height: 14px; border-radius: 3px; display: inline-block; }
.keyholder { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.keyicon { font-size: 26px; }

/* three ways */
.ways { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.way { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.way .wt { font-family: var(--display); font-size: 22px; font-weight: 600; }
.way .wc { font-family: var(--mono); font-size: 14px; color: var(--signal); }
.way .wa { font-size: 16px; }
.way .wb { font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
.anim { height: 90px; background: var(--paper); border-radius: 10px; position: relative; overflow: hidden; }
.anim .w { position: absolute; width: 22px; height: 22px; border-radius: 50%; top: 34px; }

/* quiz */
.q { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.25; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: 700; }
.opt:hover { border-color: var(--signal); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { min-height: 60px; font-size: 17px; }

/* summary */
.sumlist { display: flex; flex-direction: column; gap: 14px; }
.sumrow { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; font-size: 22px; font-family: var(--display); font-weight: 500; line-height: 1.3; }
.sumrow .sn { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #F8F6EF; display: flex; align-items: center; justify-content: center; font-size: 18px; }

/* computer model */
.pc { border: 2px solid var(--ink); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
.pc-t { font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.comp { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--card); transition: border-color .25s, background .25s, box-shadow .25s; cursor: pointer; text-align: left; }
.comp:hover { border-color: var(--signal); }
.comp.hl { border-color: var(--hot); background: var(--hot-soft); box-shadow: 0 0 0 3px rgba(201,88,28,.2); }
.comp.rel { border-color: var(--signal); border-style: dashed; background: #EEF3FA; }
.ct { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.comp.hl > .ct { color: var(--hot-ink); }
.hw { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
.cores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.corec { padding: 5px 8px; font-size: 13px; display: flex; flex-direction: column; gap: 0; }
.corec b { font-size: 12px; }
.corec.busy { background: var(--hot); color: #fff; border-color: var(--hot); }
.corec.busy.hl { box-shadow: 0 0 0 3px rgba(201,88,28,.35); }
.corec.other { background: #ECE8DC; color: var(--muted); }
.corec.free { background: var(--ok-soft); color: var(--ok); }
.ramsegs { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.rseg { font-size: 12px; border-radius: 6px; padding: 3px 8px; background: #ECE8DC; color: var(--muted); }
.rseg.ours { background: var(--signal-soft); color: var(--ink); }
.rseg .vars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.rseg .vars span { font-family: var(--mono); font-size: 11px; background: #fff; border-radius: 4px; padding: 1px 5px; animation: pop .3s ease-out; }
.osin { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; margin-top: 6px; }
.procin { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.thr { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; padding: 5px 8px; background: #fff; }
.thr .pill { font-size: 11px; padding: 1px 8px; }
.gilb { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 5px 8px; background: #fff; }
.socks { display: flex; flex-direction: column; gap: 6px; }
.sock { font-family: var(--mono); font-size: 12px; padding: 6px 8px; background: #fff; display: flex; flex-direction: column; gap: 3px; }

(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const enc = new TextEncoder();
const bin = n => n.toString(2).padStart(8, '0');

/* ---------- punched tape ---------- */
function tapeHTML(text, animate) {
  let cols = '', labs = '';
  for (const ch of text) {
    const bytes = Array.from(enc.encode(ch));
    bytes.forEach((b, i) => {
      let holes = '';
      for (let k = 0; k < 8; k++) {
        if (k === 3) holes += '<i class="h sp"></i>';
        holes += `<i class="h ${(b >> (7 - k)) & 1 ? 'on' : 'off'}"></i>`;
      }
      cols += `<div class="tcol ${i === 0 ? 'first' : ''} ${animate ? 'new' : ''}" data-ch="${esc(ch === ' ' ? '␣' : ch)}" data-b="${bin(b)}" data-k="${i + 1}" data-n="${bytes.length}" tabindex="0">${holes}</div>`;
      labs += `<span class="tlab ${i === 0 ? 'ch' : ''}">${i === 0 ? esc(ch === ' ' ? '␣' : ch) : '·'}</span>`;
    });
  }
  return `<div class="tape-wrap"><div class="tape">${cols}</div><div class="tlabels">${labs}</div></div>`;
}

function tapeHover(box, out, idle) {
  const showCol = (c) => {
    if (!c || !c.dataset.b) return;
    $$('.tcol', box).forEach(x => x.classList.toggle('pick', x === c));
    const part = +c.dataset.n > 1 ? `, байт ${c.dataset.k} з ${c.dataset.n}` : '';
    out.innerHTML = `Символ <b>«${c.dataset.ch}»</b>${part}: <b class="mono">${c.dataset.b}</b> = ${parseInt(c.dataset.b, 2)} · отвір = 1, немає = 0`;
  };
  const clear = () => { $$('.tcol', box).forEach(x => x.classList.remove('pick')); if (idle) out.innerHTML = idle(); };
  box.addEventListener('mouseover', e => showCol(e.target.closest('.tcol')));
  box.addEventListener('focusin', e => showCol(e.target.closest('.tcol')));
  box.addEventListener('click', e => showCol(e.target.closest('.tcol')));
  box.addEventListener('mouseleave', clear);
}

/* ---------- computer model (shared by explorer and simulator) ---------- */
// s = { hl:[keys], rel:[keys], coreAll:bool, cores:[{t, cls:'busy'|'other'|'free', ours}], proc:{name, threads:[{name, st, lbl}], gil:'…'|null, vars:[]}|null,
//       socks:[{label, buf, closed}], nic:bool, wire:'', client:''|null }
function pcHTML(s) {
  const hl = s.hl || [], rel = s.rel || [];
  const H = k => hl.includes(k) ? ' hl' : rel.includes(k) ? ' rel' : '';
  const coreCls = c => (hl.includes('core') && (s.coreAll || c.ours)) ? ' hl' : (rel.includes('core') && (s.coreAll || c.ours)) ? ' rel' : '';
  const cores = s.cores.map((c, i) => `<div class="comp corec ${c.cls}${coreCls(c)}" data-c="core"><b>Ядро ${i + 1}</b><span>${c.t}</span></div>`).join('');
  const p = s.proc;
  const ram = `<div class="ramsegs"><div class="rseg">Операційна система</div>${p ? `<div class="rseg ours">${esc(p.name)}<div class="vars">${p.vars.length ? p.vars.map(v => `<span>${esc(v)}</span>`).join('') : '<span>код Python</span>'}</div></div>` : ''}<div class="rseg">браузер, музика, інші програми</div></div>`;
  const stPill = { run: 'run', sleep: 'sleep', wait: 'wait' };
  const procBox = p ? `<div class="comp proc${H('proc')}" data-c="proc"><div class="ct"><span>Процес · ${esc(p.name)}</span><span>PID 4021</span></div><div class="procin">
      ${p.threads.map(t => `<div class="comp thr${H('thread')}" data-c="thread"><span>${esc(t.name)}</span><span class="pill ${stPill[t.st]}">${esc(t.lbl)}</span></div>`).join('')}
      <div class="comp gilb${H('gil')}" data-c="gil"><span aria-hidden="true">🔑</span><span>GIL: ${p.gil ? 'у ' + esc(p.gil) : 'вільний'}</span></div>
    </div></div>` : `<div class="comp proc" data-c="proc" style="border-style:dashed"><div class="ct"><span>Процесу ще немає</span></div></div>`;
  const socks = `<div class="comp${H('socket')}" data-c="socket"><div class="ct"><span>Сокети</span></div><div class="socks" style="margin-top:6px">${s.socks.length ? s.socks.map(k => `<div class="sock${k.closed ? ' closed' : ''}"><span>${esc(k.label)}</span>${k.buf !== undefined ? `<span class="sbuf">${k.buf ? [...k.buf].map(c => `<span>${esc(c)}</span>`).join('') : '<em class="note" style="font-size:11px">буфер порожній</em>'}</span>` : ''}</div>`).join('') : '<span class="note" style="font-size:12px">жодного</span>'}</div></div>`;
  return `<div class="pc" role="group" aria-label="Модель комп’ютера-сервера">
    <div class="pc-t"><span>Комп’ютер-сервер · IP 192.168.1.10</span><span>натисни на будь-яку частину</span></div>
    <div class="hw">
      <div class="comp${H('cpu')}" data-c="cpu"><div class="ct"><span>Процесор (CPU)</span><span>залізо</span></div><div class="cores">${cores}</div></div>
      <div class="comp${H('ram')}" data-c="ram"><div class="ct"><span>Пам’ять (RAM)</span><span>залізо</span></div>${ram}</div>
    </div>
    <div class="comp${H('os')}" data-c="os"><div class="ct"><span>Операційна система</span><span>Linux</span></div>
      <div class="osin">${procBox}<div style="display:flex;flex-direction:column;gap:8px">${socks}<div class="comp nic${s.nic ? ' act' : ''}${H('nic')}" data-c="nic"><div class="ct"><span>Мережева карта</span></div></div></div></div>
    </div>
    <div class="netline"><span></span><span class="wire${s.wire ? ' act' : ''}">${s.wire ? esc(s.wire) : '⇅ інтернет'}</span><div class="clientb${s.client ? ' on' : ''}">${s.client ? esc(s.client) : 'клієнтів немає'}</div></div>
  </div>`;
}

add('cores', 'Python і комп’ютер', (el, ctx) => {
  el.innerHTML = `
  <div class="text">

    <h2>Більше кухарів — більше справ одночасно</h2>

    <p class="tip">Більше ядер допомагає, лише коли є що <span class="key">рахувати</span>. Якщо програма чекає мережу, ядра просто простоюють.</p>
  </div>
  <div class="widget">
    <span class="wlabel">Розклади 8 завдань по ядрах</span>
    <div class="controls"><span class="note">Ядер:</span>${[1, 2, 4, 8].map(n => `<button type="button" class="btn ghost cb" data-n="${n}">${n}</button>`).join('')}<button class="btn" id="runc" type="button">Запустити</button></div>
    <div class="lanes" id="lanes"></div>
    <div class="stats"><div class="stat"><span class="sl">Час</span><span class="big" id="ct">0,0 с</span></div><div class="stat"><span class="sl">Кожне завдання</span><span class="big" style="font-size:28px">1 с роботи</span></div></div>
    <p class="note" id="cn">Обери кількість ядер і натисни «Запустити».</p>
  </div>`;
  let cores = 2;
  const layout = () => {
    $$('.cb', el).forEach(b => b.classList.toggle('sel', +b.dataset.n === cores));
    const per = 8 / cores;
    let h = '';
    for (let c = 0; c < cores; c++) {
      let t = '';
      for (let j = 0; j < per; j++) t += `<div class="task" style="flex:1"><div class="fill"></div><span>З${c + 1 + j * cores}</span></div>`;
      h += `<div class="lane"><span class="ln">Ядро ${c + 1}</span><div class="track">${t}</div></div>`;
    }
    $('#lanes', el).innerHTML = h; $('#ct', el).textContent = '0,0 с';
  };
  $$('.cb', el).forEach(b => b.onclick = () => { ctx.run++; cores = +b.dataset.n; layout(); $('#cn', el).textContent = `Ядер: ${cores}. Натисни «Запустити».`; });
  $('#runc', el).onclick = () => {
    const my = ++ctx.run; layout();
    const per = 8 / cores, unit = 650, t0 = performance.now();
    const lanes = $$('.lane', el);
    const tick = (now) => {
      if (my !== ctx.run) return;
      const e = (now - t0) / unit;
      lanes.forEach(l => $$('.task', l).forEach((t, j) => {
        const p = Math.max(0, Math.min(1, e - j));
        t.querySelector('.fill').style.transform = `scaleX(${p})`; t.classList.toggle('done', p >= 1);
      }));
      $('#ct', el).textContent = Math.min(e, per).toFixed(1).replace('.', ',') + ' с';
      if (e < per) requestAnimationFrame(tick);
      else $('#cn', el).innerHTML = `8 завдань на ${cores} ${cores === 1 ? 'ядрі' : 'ядрах'} — <b>${per} с</b>. ${cores < 8 ? 'Додай ядер — стане швидше.' : 'Швидше вже не буде: кожне ядро має одне завдання.'}`;
    };
    requestAnimationFrame(tick);
  };
  layout();
});

add('tcpwhy', 'Мережа', (el, ctx) => {

    <p><span class="key">IP</span> доставляє окремі пакети за адресою, але нічого не обіцяє: пакет може загубитися, прийти двічі або обігнати попередній. Інтернет — це тисячі маршрутизаторів, і кожен пакет може піти своїм шляхом.</p>
    <p><span class="key">TCP</span> працює поверх IP і робить із цього хаосу надійну трубу:</p>
    <ul class="tcp-list">
      <li><b>Рукостискання</b> — спершу сторони домовляються про з’єднання: SYN → SYN-ACK → ACK.</li>
      <li><b>Нумерація</b> — кожен байт має номер, тож отримувач складає їх у правильному порядку.</li>
      <li><b>Підтвердження</b> — отримувач відповідає ACK: «до цього байта все маю».</li>
      <li><b>Повторне надсилання</b> — немає підтвердження вчасно, відправник шле ще раз.</li>
    </ul>
    <p class="note">Ідею TCP описали Вінтон Серф і Роберт Кан у 1974 році; стандарт вийшов у 1981-му, а з 1 січня 1983 року ARPANET перейшла на TCP/IP. Коли надійність не потрібна, а важлива швидкість (відеодзвінки, ігри), використовують простіший протокол UDP.</p>
  </div>
  <div class="widget">
    <span class="wlabel">Надішли «${MSG}» через ненадійну мережу</span>
    <div class="cfg">
      <span class="cl">Протокол</span><div class="seg" id="pm"><button type="button" class="btn ghost" data-v="ip">Лише IP</button><button type="button" class="btn ghost" data-v="tcp">IP + TCP</button></div>
      <span class="cl">Мережа</span><div class="seg" id="nq"><button type="button" class="btn ghost" data-v="0.3">погана: губить пакети</button><button type="button" class="btn ghost" data-v="0">ідеальна</button></div>
    </div>
    <div class="tcpsim">
      <div class="ep"><b>Відправник</b><span class="mono">${PK.map((p, i) => `<i data-s="${i}">${p}</i>`).join('')}</span></div>
      <div class="air" id="air"><span class="air-l">інтернет: маршрутизатори, кабелі</span></div>
      <div class="ep"><b>Отримувач</b><span class="mono slots" id="slots">${PK.map(() => '<i>··</i>').join('')}</span></div>
    </div>
    <div class="controls"><button class="btn" id="send" type="button">Надіслати</button></div>
    <div class="caption" id="res">Обери протокол і натисни «Надіслати». Пакети йдуть по 2 байти, кожен своїм шляхом.</div>
    <div class="log" id="tl" style="min-height:96px"></div>
  </div>`;
  const air = $('#air', el);
  let proto = 'ip', loss = 0.3;
  const segSel = () => { $$('#pm .btn', el).forEach(b => b.classList.toggle('sel', b.dataset.v === proto)); $$('#nq .btn', el).forEach(b => b.classList.toggle('sel', +b.dataset.v === loss)); };
  $$('#pm .btn', el).forEach(b => b.onclick = () => { proto = b.dataset.v; segSel(); ctx.run++; reset(); });
  $$('#nq .btn', el).forEach(b => b.onclick = () => { loss = +b.dataset.v; segSel(); ctx.run++; reset(); });
  const L = [];
  const log = (s, c = '') => { L.push(`<span class="${c}">${s}</span>`); if (L.length > 5) L.shift(); $('#tl', el).innerHTML = L.join(''); };
  const reset = () => { $('#send', el).disabled = false; $$('.pkt', air).forEach(p => p.remove()); $('#slots', el).innerHTML = PK.map(() => '<i>··</i>').join(''); $$('.ep i[data-s]', el).forEach(x => x.className = ''); L.length = 0; $('#tl', el).innerHTML = ''; $('#res', el).innerHTML = proto === 'ip' ? 'Лише IP: пакети просто кидають у мережу. Що дійде — те й дійде.' : 'IP + TCP: з’єднання, нумерація, підтвердження і повторне надсилання.'; };
  // fly a chip across the air; returns true if delivered
  const fly = (label, dir, cls, lane, dur, lost) => new Promise(res => {
    const c = document.createElement('span'); c.className = 'pkt ' + cls; c.textContent = label;
    c.style.top = (8 + lane * 26) + 'px'; c.style.left = dir > 0 ? '0%' : 'calc(100% - 64px)';
    air.appendChild(c);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      c.style.transition = `left ${dur}ms linear, opacity .3s`;
      c.style.left = lost ? '45%' : (dir > 0 ? 'calc(100% - 64px)' : '0%');
    }));
    setTimeout(() => {
      if (lost) { c.classList.add('lost'); c.textContent = '✕ ' + label; setTimeout(() => { c.style.opacity = 0; setTimeout(() => c.remove(), 300); }, 400); res(false); }
      else { c.style.opacity = 0; setTimeout(() => c.remove(), 300); res(true); }
    }, lost ? dur * 0.45 : dur);
  });
  const run = async () => {
    const my = ++ctx.run; reset(); $('#send', el).disabled = true;
    const alive = () => my === ctx.run;
    const slots = $$('#slots i', el);
    const src = $$('.ep i[data-s]', el);
    if (proto === 'ip') {
      const got = [];
      await Promise.all(PK.map(async (p, i) => {
        await sleep(i * 150);
        src[i].className = 'sent';
        const ok = await fly(p, 1, 'data', i, 700 + Math.random() * 1300, Math.random() < loss);
        if (!alive()) return;
        if (ok) { got.push(p); slots[got.length - 1].textContent = p; slots[got.length - 1].className = 'got'; log(`прийшов пакет «${p}»`, 'dim'); }
        else log(`пакет «${p}» загубився`, 'warn');

      if (!alive()) return;
      const text = got.join('');

        : `Отримано <b>«${esc(text) || '—'}»</b> замість «${MSG}». ${got.length < PK.length ? 'Частина пакетів загубилася, ' : ''}порядок залежить від того, хто швидше доїхав. І ніхто про це не знає.`;
    } else {
      // handshake
      log('SYN → «хочу з’єднатися»', 'dim'); await fly('SYN', 1, 'ctl', 0, 600, false); if (!alive()) return;
      log('← SYN-ACK «згоден»', 'dim'); await fly('SYN-ACK', -1, 'ack', 1, 600, false); if (!alive()) return;
      log('ACK → «з’єднання встановлено»', 'ok'); await fly('ACK', 1, 'ctl', 2, 600, false); if (!alive()) return;
      const have = Array(PK.length).fill(false); let round = 0;
      while (have.includes(false) && alive()) {
        round++;
        const todo = have.map((h, i) => h ? -1 : i).filter(i => i >= 0);
        if (round > 1) log(`немає підтвердження для №${todo.map(i => i + 1).join(', №')} — надсилаю ще раз`, 'warn');
        await Promise.all(todo.map(async (i, k) => {
          await sleep(k * 150);
          src[i].className = 'sent';
          const ok = await fly(`№${i + 1} ${PK[i]}`, 1, 'data', i, 700 + Math.random() * 1300, Math.random() < (round > 3 ? 0 : loss));
          if (!alive() || !ok) return;
          have[i] = true; slots[i].textContent = PK[i]; slots[i].className = 'got';
          await fly(`ACK №${i + 1}`, -1, 'ack', i, 600, false);
          if (alive()) src[i].className = 'acked';
        }));
        if (!alive()) return;
        if (have.includes(false)) await sleep(500);
      }
      if (!alive()) return;
      log(`програма отримує через recv(): b'${MSG}'`, 'ok');
      $('#res', el).innerHTML = `Отримано <b>«${MSG}»</b> — повністю й у правильному порядку${round > 1 ? `, хоча мережа губила пакети (раундів надсилання: ${round})` : ''}. Програма бачить лише рівний потік байтів.`;
    }
    $('#send', el).disabled = false;
  };
  $('#send', el).onclick = run;
  segSel(); reset();

    <div class="controls"><button type="button" class="btn ghost md" data-m="io">Потоки чекають мережу</button><button type="button" class="btn ghost md" data-m="cpu">Потоки рахують</button><button type="button" class="btn ghost md" data-m="proc">Процеси рахують</button></div>

    <p class="caption" id="gc"></p>
  </div>`;
  const programs = { io: ['c', 'c', ...Array(8).fill('w'), 'c', 'c'], cpu: Array(8).fill('c'), proc: Array(8).fill('c') };
  const texts = {
    io: 'Кожен потік трохи рахує, потім довго чекає мережу. Під час очікування ключ вільний, тож потоки чекають <b>одночасно</b>. Виграш приблизно втричі.',
    cpu: 'Усі три потоки хочуть рахувати, а ключ один. Вони працюють <b>по черзі</b>, і загальний час такий самий, як без потоків.',
    proc: 'Три окремі процеси — три інтерпретатори Python, у кожного свій ключ і своє ядро. Вони рахують <b>справді одночасно</b>.',
  };
  const play = async (mode) => {
    const my = ++ctx.run;
    $$('.md', el).forEach(b => b.classList.toggle('sel', b.dataset.m === mode));
    const prog = programs[mode];
    const th = [0, 1, 2].map(() => ({ pc: 0, wait: 0, cells: [] }));
    const seqTotal = prog.length * 3;
    $('#ts', el).textContent = seqTotal + ' тактів';
    $('#gc', el).innerHTML = texts[mode];
    let holder = -1, slice = 0, rr = 0, t = 0;
    const draw = () => {
      const width = Math.max(seqTotal, t);
      $('#gl', el).innerHTML = th.map((x, i) => `<div class="glane"><span class="gl">${mode === 'proc' ? 'Процес' : 'Потік'} ${i + 1}</span><div class="cells">${Array.from({ length: width }, (_, j) => `<i class="cell ${x.cells[j] || ''}"></i>`).join('')}</div></div>`).join('');
      $('#tt', el).textContent = t + ' тактів';
    };
    while (th.some(x => x.pc < prog.length)) {
      if (mode === 'proc') {
        th.forEach(x => { if (x.pc < prog.length) { x.cells.push('run'); x.pc++; } else x.cells.push('done'); });

        }
        if (holder === -1) {
          for (let k = 0; k < 3; k++) { const c = (rr + k) % 3; const x = th[c]; if (x.pc < prog.length && prog[x.pc] === 'c') { holder = c; rr = (c + 1) % 3; break; } }
        }
        th.forEach((x, i) => {
          if (x.pc >= prog.length) { x.cells.push('done'); return; }
          if (prog[x.pc] === 'w') { x.cells.push('io'); x.pc++; return; }

          x.cells.push('wait');
        });
        if (holder !== -1) slice++;
        $('#kh', el).textContent = holder === -1 ? 'Ключ вільний' : `Ключ у потоку ${holder + 1}`;
      }
      t++; draw();
      await sleep(170); if (my !== ctx.run) return;
    }
    $('#kh', el).textContent = mode === 'proc' ? 'У кожного процесу свій ключ' : 'Ключ вільний';
    const gain = seqTotal / t;
    $('#gc', el).innerHTML = texts[mode] + ` <br><b>Результат: ${t} тактів замість ${seqTotal}${gain > 1.2 ? ` — у ${gain.toFixed(1).replace('.', ',')} раза швидше` : ' — без виграшу'}.</b>`;
  };
  $$('.md', el).forEach(b => b.onclick = () => play(b.dataset.m));
  play('io');
});

        else if (running.has(w)) { w.cells.push('run'); adv(w); runCells++; }
        else if (owners.includes(w)) w.cells.push('nocore');
        else w.cells.push('wait');
      });
      G.forEach(g => { if (g.owner !== -1) g.slice++; });
      tick++;
    }

      ['Пам’ять', 'спільна → ризик гонок', 'спільна, перемикання лише на await', 'окрема → дані через pickle'],
      ['Ціна одного працівника', 'помірна', 'дуже мала', 'висока'],
      ['Найкраще для', 'мережа, файли', 'тисячі з’єднань', 'важкі обчислення'],
    ];
    w.innerHTML = `<span class="wlabel">Порівняння</span><div class="hist-wrap"><table class="hist cmpt"><thead><tr><th></th><th>Потоки</th><th>asyncio</th><th>Процеси</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>
      <span class="wlabel">Обери інструмент для задачі</span>
      <div class="controls">${[['Завантажити дані зі 100 метеостанцій', 'Потоки або asyncio: програма майже весь час чекає мережу.'], ['Чат на 10 000 користувачів', 'asyncio: тисячі з’єднань в одному потоці коштують дуже мало.'], ['Обробити 500 супутникових знімків', 'Процеси: це обчислення, кожен знімок рахує окреме ядро.'], ['Прочитати 50 файлів з диска', 'Потоки: очікування диска, звичайні функції читання файлів.']].map((x, i) => `<button type="button" class="btn ghost pick" data-i="${i}" data-a="${esc(x[1])}">${x[0]}</button>`).join('')}</div>
      <p class="caption" id="pa">Натисни на задачу.</p>`;
    $$('.pick', w).forEach(b => b.onclick = () => { $$('.pick', w).forEach(x => x.classList.toggle('sel', x === b)); $('#pa', w).innerHTML = `<b>${b.textContent}:</b> ${b.dataset.a}`; });
  };
  const show = () => {
    ctx.run++;
    $$('.htab', el).forEach(b => { b.classList.toggle('sel', b.dataset.k === tool); b.setAttribute('aria-selected', b.dataset.k === tool); });
    $('#wh', el).textContent = TOOLS[tool].h; $('#wt', el).innerHTML = TOOLS[tool].t;
    tool === 'cmp' ? renderCmp($('#ww', el)) : renderSim($('#ww', el));
  };
  $$('.htab', el).forEach(b => b.onclick = () => { tool = b.dataset.k; show(); });
  show();
});


/* 14. Quiz */
add('quiz', 'Перевір себе', (el) => {
  const Q = [
    ['Програма збирає дані зі 100 метеостанцій. Кожна відповідає 5 секунд. Що найбільше її гальмує?', ['Важкі обчислення', 'Очікування мережі', 'Брак пам’яті', 'GIL забороняє підключення'], 1, 'Програма майже весь час чекає відповіді. Допоможуть потоки або asyncio: чекати всі станції одночасно.'],
    ['Потік викликав recv() і чекає дані 10 секунд. Що робить ядро процесора?', ['Зайняте цим потоком усі 10 секунд', 'Вільне для інших програм', 'Вимикається', 'Постійно перевіряє мережу'], 1, 'Потік спить, ОС віддає ядро іншим програмам і розбудить потік, коли прийдуть дані.'],
    ['Треба обробити 500 супутникових знімків, кожен — хвилина обчислень. Що обрати?', ['Потоки', 'asyncio', 'Процеси', 'Один потік, але швидший комп’ютер'], 2, 'Це задача, що рахує. Через GIL потоки тут не допоможуть, а процеси рахують на різних ядрах одночасно.'],
    ['Клієнт надіслав «Hello» і «World». Що поверне перший recv(1024)?', ['Завжди «Hello»', 'Завжди «HelloWorld»', 'Будь-яку частину потоку байтів', 'Помилку'], 2, 'TCP — це потік байтів. Межі між викликами sendall() не зберігаються.'],
    ['Навіщо порт, якщо вже є IP-адреса?', ['Щоб шифрувати дані', 'Щоб знайти потрібну програму на комп’ютері', 'Щоб пришвидшити мережу', 'Це те саме, що IP'], 1, 'IP — номер будинку, порт — номер квартири. За портом ОС знає, якому сокету віддати байти.'],
  ];
  let i = 0, score = 0, answered = false;
  el.innerHTML = `
  <div class="text">
    <p class="eyebrow">Перевір себе</p>
    <h2>П’ять питань без коду</h2>
    <p class="lead">Обери відповідь — одразу побачиш пояснення.</p>
    <div class="stats"><div class="stat"><span class="sl">Правильно</span><span class="big" id="sc">0 / 5</span></div></div>
  </div>
  <div class="widget">
    <span class="wlabel" id="qn"></span>
    <p class="q" id="qq"></p>
    <div class="opts" id="qo"></div>
    <p class="fb" id="fb"></p>
    <div class="controls"><button class="btn" id="qnext" type="button">Наступне питання</button></div>
  </div>`;
  const show = () => {
    answered = false;
    const [q, opts] = Q[i];
    $('#qn', el).textContent = `Питання ${i + 1} з ${Q.length}`;
    $('#qq', el).textContent = q;
    $('#qo', el).innerHTML = opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${esc(o)}</button>`).join('');
    $('#fb', el).textContent = '';
    $('#qnext', el).disabled = true;
    $('#qnext', el).textContent = i === Q.length - 1 ? 'Пройти ще раз' : 'Наступне питання';
    $$('.opt', el).forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const j = +b.dataset.j, ok = j === Q[i][2];
      if (ok) score++;
      $$('.opt', el).forEach((x, n) => { if (n === Q[i][2]) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      $('#fb', el).innerHTML = `<b>${ok ? 'Так.' : 'Не зовсім.'}</b> ${Q[i][3]}`;
      $('#sc', el).textContent = `${score} / ${Q.length}`;
      $('#qnext', el).disabled = false;
    });
  };
  $('#qnext', el).onclick = () => { if (i === Q.length - 1) { i = 0; score = 0; $('#sc', el).textContent = `0 / ${Q.length}`; } else i++; show(); };
  show();
});

/* 15. Summary */
add('summary', 'Перевір себе', (el) => {
  el.innerHTML = `
  <div class="text">
    <p class="eyebrow">Уся картина</p>
    <h2>Чотири речення, які варто запам’ятати</h2>
    <div class="sumlist">
      <div class="sumrow"><span class="sn">1</span><span>Усе в комп’ютері — байти: нулі та одиниці.</span></div>
      <div class="sumrow"><span class="sn">2</span><span>Процесор рахує, пам’ять тримає, а ОС розподіляє роботу між процесами й потоками.</span></div>
      <div class="sumrow"><span class="sn">3</span><span>Сокет з’єднує програму з мережею; IP знаходить комп’ютер, порт — програму.</span></div>
      <div class="sumrow"><span class="sn">4</span><span>Задачі, що чекають, — потоки або asyncio. Задачі, що рахують, — процеси.</span></div>
    </div>
  </div>
  <div class="widget">
    <span class="wlabel">Наостанок — на перфострічці</span>
    <div id="tp"></div>
    <p class="note mono" id="pn" style="min-height:22px"></p>
    <p class="note">«Дякую» — 5 українських літер по 2 байти в UTF-8, плюс «!» — 1 байт.</p>
    <div class="controls"><button class="btn ghost" id="again" type="button">Пробити ще раз</button><button class="btn" id="home" type="button">На початок</button></div>
  </div>`;
  const draw = async () => {
    const my = ++ctx.run, box = $('#tp', el);
    box.innerHTML = tapeHTML('Дякую!', false);
    const cols = $$('.tcol', box), labs = $$('.tlab', box);
    const bits = cols.map(c => $$('.h:not(.sp)', c).map(h => h.classList.contains('on')));
    cols.forEach(c => $$('.h:not(.sp)', c).forEach(h => { h.classList.remove('on'); h.classList.add('off'); }));
    labs.forEach(l => l.style.visibility = 'hidden');
    $('#again', el).disabled = true; $('#pn', el).textContent = 'Пробиваємо…';
    for (let i = 0; i < cols.length; i++) {
      await sleep(i ? 420 : 300); if (my !== ctx.run) return;
      cols.forEach(c => c.classList.remove('cur'));
      cols[i].classList.add('cur', 'new');
      $$('.h:not(.sp)', cols[i]).forEach((h, j) => { if (bits[i][j]) { h.classList.remove('off'); h.classList.add('on'); } });
      labs[i].style.visibility = '';
      $('#pn', el).textContent = `Байт ${i + 1} з ${cols.length}: ${bits[i].map(b => b ? 1 : 0).join('')}`;
    }
    await sleep(400); if (my !== ctx.run) return;
    cols.forEach(c => c.classList.remove('cur'));
    $('#again', el).disabled = false; $('#pn', el).textContent = 'Готово: 6 символів, 11 байтів. Наведи або натисни на колонку, щоб побачити її біти.'; tapeHover(box, $('#pn', el), () => 'Готово: 6 символів, 11 байтів. Наведи або натисни на колонку, щоб побачити її біти.');
  };
  $('#again', el).onclick = draw; $('#home', el).onclick = () => go(0);
  draw();
});

/* ---------- navigation ---------- */
{ const ORDER = ['start', 'journey', 'run', 'model', 'cores', 'speed', 'time', 'wait', 'ways', 'race', 'nethistory', 'tcpwhy', 'tcp', 'history', 'socket', 'recv', 'server', 'block', 'gil', 'gildeep', 'lab', 'quiz', 'summary']; const pos = id => { const i = ORDER.indexOf(id); return i < 0 ? 999 : i; }; S.sort((a, b) => pos(a.id) - pos(b.id)); }
const main = $('#main'), dots = $('#dots');
let cur = -1; const ctx = { run: 0 };
dots.innerHTML = S.map((s, i) => `<button type="button" class="dot ${i > 0 && S[i - 1].section !== s.section ? 'sec' : ''}" aria-label="Екран ${i + 1}" title="${esc(s.section)}"></button>`).join('');
$$('.dot').forEach((d, i) => d.onclick = () => go(i));
function go(i, fromHash) {
  i = Math.max(0, Math.min(S.length - 1, i));
  if (i === cur) return;
  cur = i; ctx.run++;
  const sc = S[i];
  const el = document.createElement('section');
  el.className = 'stage scene-enter';
  sc.render(el, ctx);
  main.replaceChildren(el); main.scrollTop = 0;
  $('#sect').textContent = sc.section;
  $('#counter').textContent = `${i + 1} / ${S.length}`;
  $$('.dot').forEach((d, j) => { d.classList.toggle('on', j === i); d.setAttribute('aria-current', j === i ? 'step' : 'false'); });
  $('#prev').disabled = i === 0; $('#next').disabled = i === S.length - 1;
  if (!fromHash && location.hash !== '#' + sc.id) { try { history.replaceState(null, '', '#' + sc.id); } catch (e) { location.hash = sc.id; } }
}
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
});
const fromHash = () => { const id = location.hash.slice(1); const i = S.findIndex(s => s.id === id); return i < 0 ? 0 : i; };
window.addEventListener('hashchange', () => go(fromHash(), true));
go(fromHash(), true);
})();
</script>
