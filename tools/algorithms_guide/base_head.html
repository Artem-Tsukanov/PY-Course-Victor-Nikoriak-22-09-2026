<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Алгоритми наживо — повний гайд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky tab bar; each lesson = explanation → flow schema → live visualization + data-structure strip → Python code with the active line lit. */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --fg:#17202a; --muted:#5d6b7a; --line:#d8dfe8;
  --ink:#1f3a5f;            /* headings, default bars */
  --cur:#e8a300;            /* current / comparing */
  --swap:#e4572e;           /* swap / write */
  --ok:#1b9e77;             /* sorted / found / visited */
  --pivot:#7b4fbf;          /* pivot / special pointer */
  --codebg:#1b2430; --codefg:#e6edf3; --codehl:#3a4a2a;
  --flowbg:#eef2f7;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#171e28; --fg:#e4e9f0; --muted:#97a3b2; --line:#2b3542;
  --ink:#8fb4e8; --cur:#f2b632; --swap:#f07a56; --ok:#3cc29a; --pivot:#b48ff0;
  --codebg:#0b1017; --codefg:#dce3ea; --codehl:#2d4a26; --flowbg:#1e2733; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#171e28; --fg:#e4e9f0; --muted:#97a3b2; --line:#2b3542;
  --ink:#8fb4e8; --cur:#f2b632; --swap:#f07a56; --ok:#3cc29a; --pivot:#b48ff0;
  --codebg:#0b1017; --codefg:#dce3ea; --codehl:#2d4a26; --flowbg:#1e2733; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{padding-block:28px 12px}
header.top h1{font-size:clamp(28px,4vw,40px);margin:0 0 6px;color:var(--ink);text-wrap:balance;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted);max-width:68ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-block:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer}
nav.tabs button:hover{color:var(--fg);background:var(--flowbg)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cur);outline-offset:2px}

section.lesson{display:none;padding-block:28px 0}
section.lesson.active{display:block}
.lesson h2{font-size:28px;margin:0 0 8px;color:var(--ink);text-wrap:balance}
.lead{color:var(--muted);max-width:72ch;margin:0 0 18px}
.lead b{color:var(--fg)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.controls label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);min-width:110px}
.btn:disabled{opacity:.45;cursor:default}
select,input[type=number],input[type=text]{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
input[type=range]{accent-color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:10px}
.stats b{color:var(--fg);font-family:var(--mono);font-weight:600}
.msg{min-height:24px;font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.msg code,.lead code{font-family:var(--mono);font-size:.92em;background:var(--flowbg);padding:1px 5px;border-radius:4px}

/* flow schema */
.flow{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;margin-bottom:14px}
.flow .node{background:var(--flowbg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.flow .node.on{background:var(--cur);color:#1b1b1b;border-color:var(--cur);font-weight:600}
.flow .node.end.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.flow .arrow{width:22px;text-align:center;color:var(--muted);font-size:14px}

/* bars */
.bars{display:flex;align-items:flex-end;gap:3px;height:220px;padding-top:6px}
.bar{flex:1;min-width:0;background:var(--ink);border-radius:3px 3px 0 0;position:relative;transition:height .12s}
.bar.cmp{background:var(--cur)}.bar.swap{background:var(--swap)}.bar.ok{background:var(--ok)}.bar.pivot{background:var(--pivot)}.bar.dim{opacity:.35}
.bar span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px;font-family:var(--mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

/* cells (search) */
.cells{display:flex;gap:4px;flex-wrap:wrap}
.cell{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-weight:500;position:relative;background:var(--panel)}
.cell.cmp{background:var(--cur);color:#1b1b1b;border-color:var(--cur)}
.cell.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.cell.dim{opacity:.3}
.cell.seen{background:var(--flowbg)}
.cell .tag{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:11px;color:var(--pivot);font-family:var(--mono);margin-top:2px}
.cell .idx{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.row{margin:22px 0 26px}
.row h4{margin:0 0 20px;font-size:15px;font-weight:600}
.row h4 small{color:var(--muted);font-weight:400;margin-left:8px}

/* data structure strip */
.ds{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px;font-family:var(--mono);font-size:14px}
.ds .lab{color:var(--muted);font-family:var(--sans);font-size:13px;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--flowbg);border-radius:6px;padding:4px 10px}
.chip.hot{background:var(--cur);border-color:var(--cur);color:#1b1b1b}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.swap{background:var(--swap);border-color:var(--swap);color:#fff}
.chip.empty{color:var(--muted);border-style:dashed}

/* code */
pre.code{background:var(--codebg);color:var(--codefg);font-family:var(--mono);font-size:13.5px;line-height:1.55;border-radius:10px;padding:14px 0;margin:0;overflow-x:auto}
pre.code .ln{display:block;padding:0 16px 0 44px;position:relative;white-space:pre}
pre.code .ln::before{content:attr(data-n);position:absolute;left:14px;color:#6c7a89;font-size:12px;top:2px}
pre.code .ln.hl{background:var(--codehl)}
pre.code .k{color:#c792ea}pre.code .f{color:#82aaff}pre.code .n{color:#f78c6c}pre.code .c{color:#7f8c9b;font-style:italic}pre.code .s{color:#c3e88d}

/* graph */
svg.graph{width:100%;height:auto;display:block}
svg.graph .e{stroke:var(--line);stroke-width:3}
svg.graph .e.on{stroke:var(--ok)}
svg.graph circle{fill:var(--panel);stroke:var(--ink);stroke-width:3}
svg.graph .v.ok circle{fill:var(--ok);stroke:var(--ok)}
svg.graph .v.cur circle{fill:var(--cur);stroke:var(--cur)}
svg.graph .v.front circle{stroke:var(--cur);stroke-dasharray:5 4}
svg.graph text{font-family:var(--mono);font-weight:600;font-size:18px;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
svg.graph .v.ok text,svg.graph .v.cur text{fill:#fff}
svg.graph .v.cur text{fill:#1b1b1b}
svg.graph .ord{font-size:12px;fill:var(--muted);font-weight:400}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--flowbg);border-radius:10px;padding:12px 14px}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .l{font-size:13px;color:var(--muted)}
.memo{display:flex;flex-wrap:wrap;gap:4px}
.memo .m{width:52px;border:1px solid var(--line);border-radius:6px;text-align:center;font-family:var(--mono);font-size:12px;padding:3px 0;background:var(--panel)}
.memo .m small{display:block;color:var(--muted);font-size:10px}
.memo .m.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.memo .m.ok small{color:#e8fff6}
.memo .m.hot{background:var(--cur);border-color:var(--cur);color:#1b1b1b}.memo .m.hot small{color:#333}

table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.t td.num{font-family:var(--mono);text-align:right}
table.t tr.warn td{color:var(--swap)}
.tablewrap{overflow-x:auto}
.coins{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;align-items:center}
.coin{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;background:var(--cur);color:#1b1b1b;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.coin.cand{background:var(--flowbg);color:var(--fg)}
.coin.cand.on{background:var(--ink);color:var(--panel)}
.coin.cand.off{opacity:.35}
.note{border-left:3px solid var(--cur);padding:8px 12px;background:var(--flowbg);border-radius:0 8px 8px 0;font-size:14px;margin-top:12px}
.note.bad{border-color:var(--swap)}
svg.ga{width:100%;height:auto;display:block}
svg.ga .axis{stroke:var(--line);stroke-width:1}
svg.ga .curve{fill:none;stroke:var(--ink);stroke-width:2;opacity:.7}
svg.ga .p{fill:var(--muted);opacity:.8}
svg.ga .p.keep{fill:var(--ok);opacity:1}
svg.ga .p.drop{fill:var(--swap);opacity:.5}
svg.ga .p.new{fill:var(--cur);opacity:1}
svg.ga text{font-family:var(--mono);font-size:12px;fill:var(--muted)}
footer{color:var(--muted);font-size:14px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
